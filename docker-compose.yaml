version: '3.8'

services:
  db:
    image: mongo:6-alpine
    container_name: ubb_mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ubb_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ubb_api_backend
    restart: always
    environment:
      PORT: 3000
      MONGO_URI: mongodb://db:27017/ubbmap_db
      JWT_SECRET: secreto_ubbmap_2026
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ubb_network

networks:
  ubb_network:
    driver: bridge

volumes:
  mongo_data:
