services:
  mongo:
    image: mongo:latest
    container_name: ubb_map_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./Backend
    container_name: ubb_map_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://root:example@mongo:27017/ubbmap_db?authSource=admin
      - JWT_SECRET=secreto_ubbmap_2026
    depends_on:
      - mongo

volumes:
  mongo_data:
